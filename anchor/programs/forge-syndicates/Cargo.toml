[package]
name = "forge_syndicates"
version = "0.1.0"
description = "MagicBlock-powered devnet social trading syndicates"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "forge_syndicates"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "crank"] }
pyth-solana-receiver-sdk = "2.0.0"
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
magicblock-magic-program-api = "=0.10.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
