[package]
name = "result_registry"
version = "0.1.0"
description = "SpreadForge immutable challenge result registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "result_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
pyth-solana-receiver-sdk = "2.0.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-sdk = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
